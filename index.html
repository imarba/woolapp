<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Mi Rincón de Lana</title>
<style>
:root{
  --bg:#faf6f0; --surface:#ffffff; --text:#3d2e24; --primary:#c0623f; --accent:#7d9a7a;
  --radius:14px; --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --muted:color-mix(in srgb,var(--text) 58%,var(--bg));
  --border:color-mix(in srgb,var(--text) 13%,var(--bg));
  --soft:color-mix(in srgb,var(--primary) 11%,var(--surface));
  --soft2:color-mix(in srgb,var(--accent) 16%,var(--surface));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.app{display:flex;min-height:100vh}
.sidebar{width:232px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:700;font-size:18px}
.brand .logo{font-size:26px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:calc(var(--radius) - 4px);cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--soft)}
.nav button.active{background:var(--primary);color:#fff}
.nav .ico{width:22px;text-align:center}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px}
main{flex:1;padding:28px clamp(16px,3vw,40px) 90px;max-width:1280px;min-width:0}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card.click{cursor:pointer;transition:transform .12s,box-shadow .12s}
.card.click:hover{transform:translateY(-2px);box-shadow:0 6px 18px color-mix(in srgb,var(--text) 10%,transparent)}
.stat .n{font-size:30px;font-weight:700;color:var(--primary)}
.stat .l{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:calc(var(--radius) - 4px);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:#b3261e}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{font-size:22px;width:52px;height:52px;justify-content:center;padding:0}
input[type=text],input[type=url],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:calc(var(--radius) - 6px);background:var(--bg)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 45%,transparent);border-color:var(--primary)}
label{display:block;font-size:13px;font-weight:600;margin:0 0 4px;color:var(--muted)}
.field{margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--primary);font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.tag.alt{background:var(--soft2);color:color-mix(in srgb,var(--accent) 70%,var(--text))}
.tag.grey{background:color-mix(in srgb,var(--text) 7%,var(--surface));color:var(--muted)}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--text) 8%,var(--surface));overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:calc(var(--radius) - 6px);background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:10px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;border:2px dashed var(--border);border-radius:var(--radius)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tablewrap{overflow-x:auto}
.check{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.check.done span{text-decoration:line-through;color:var(--muted)}
.check .x{margin-left:auto;opacity:.4;border:0;background:none;cursor:pointer}
.check .x:hover{opacity:1}
.counter{display:flex;align-items:center;gap:14px}
.counter .num{font-size:40px;font-weight:700;min-width:70px;text-align:center;color:var(--primary)}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.step{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:calc(var(--radius) - 6px);cursor:pointer}
.step:hover{background:var(--soft)}
.step.cur{background:var(--soft);outline:1px solid var(--primary)}
.step .t{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--primary);color:#fff;padding:2px 7px;border-radius:6px}
.step.done .txt{text-decoration:line-through;color:var(--muted)}
.patterntext{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:var(--bg);padding:16px;border-radius:calc(var(--radius) - 6px);border:1px solid var(--border);max-height:520px;overflow:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--border);background:var(--surface);padding:7px 14px;border-radius:99px;cursor:pointer}
.tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.note{background:var(--soft2);border-left:4px solid var(--accent);padding:10px 14px;border-radius:8px;font-size:14px;margin:10px 0}
.warn{background:var(--soft);border-left:4px solid var(--primary);padding:10px 14px;border-radius:8px;font-size:14px;margin:10px 0}
.modal{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:50;overflow:auto}
.modal.hidden{display:none}
.modal-card{background:var(--surface);border-radius:var(--radius);padding:24px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
.swatch{display:flex;gap:4px}
.swatch i{width:18px;height:18px;border-radius:50%;border:1px solid var(--border)}
.preset{cursor:pointer}
.preset.active{outline:2px solid var(--primary)}
.color-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.color-row input[type=color]{width:44px;height:32px;border:1px solid var(--border);border-radius:8px;padding:0;background:none;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv b{color:var(--muted);font-weight:600}
.hero-img{width:100%;max-height:260px;object-fit:cover;border-radius:var(--radius);margin-bottom:14px}
@media (max-width:820px){
  .app{flex-direction:column}
  .sidebar{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:6px;z-index:40;border-right:0;border-top:1px solid var(--border);overflow-x:auto}
  .brand,.side-foot{display:none}
  .nav{display:flex;gap:2px;width:100%}
  .nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;justify-content:center;align-items:center;flex:1}
  main{padding-bottom:110px}
}
@media print{.sidebar,.toolbar,.btn{display:none!important}main{padding:0}}
.topbar{display:flex;justify-content:flex-end;margin:-8px 0 8px}
.topbar select{width:auto;padding:6px 10px;border-radius:99px;background:var(--surface);cursor:pointer}
th .nt{text-transform:none;font-weight:400}
</style>

</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo" id="brand-logo">🧶</span><span id="brand-name"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main><div class="topbar"><select id="langsel" onchange="setLang(this.value)"></select></div><div id="view"></div></main>
</div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modal-card" id="modal-body"></div></div>
<div id="toast"></div>

   `<h3>📐 La muestra de tensión</h3><p>Teje un cuadrado de unos 15 × 15 cm con la lana y la aguja del patrón, lávalo como lavarás la prenda, déjalo secar y cuenta los puntos y vueltas en los 10 cm centrales.</p><p>Más puntos que el patrón → usa una aguja más gruesa. Menos puntos → una más fina.</p>`,

  if(vars&&typeof v==='string')v=v.replace(/\{(\w+)\}/g,(m,x)=>vars[x]??m);return v}

const KEY='rincon-lana-v1';
const Store={
  db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('rincon-lana',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res();}catch(e){res()}})},
  get(){return new Promise(res=>{if(!this.db){try{res(JSON.parse(localStorage.getItem(KEY)))}catch(e){res(null)}return}
    const q=this.db.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})},
  set(v){return new Promise(res=>{if(!this.db){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){toast(t('noSpace'))}res();return}
    const tr=this.db.transaction('kv','readwrite');tr.objectStore('kv').put(v,KEY);tr.oncomplete=()=>res();tr.onerror=()=>{toast(t('saveErr'));res()}})}
};

function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(el._h);el._h=setTimeout(()=>el.classList.remove('show'),2200)}
function openModal(html){$('#modal-body').innerHTML=html;$('#modal').classList.remove('hidden');const f=$('#modal-body input,#modal-body select,#modal-body textarea');if(f)f.focus()}

function parseTime(s){s=String(s||'').trim();if(!s)return 0;if(/^\d+$/.test(s))return +s;const p=s.split(':').map(Number);if(p.some(isNaN))return 0;return p.reduce((a,b)=>a*60+b,0)}
function fmtTime(s){s=Math.max(0,Math.round(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
function readFile(file,asImage){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{if(!asImage)return res(r.result);
  const img=new Image();img.onload=()=>{const max=1100;let w=img.width,h=img.height;if(w>max||h>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.82))};img.onerror=()=>res(r.result);img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function download(name,content,type){const b=content instanceof Blob?content:new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function openDataUrl(d){fetch(d).then(r=>r.blob()).then(b=>window.open(URL.createObjectURL(b),'_blank'))}
const byId=(arr,id)=>arr.find(x=>x.id===id);
function snap(v,list){let best=list[0][0];for(const [s] of list){if(Math.abs(s-v)<Math.abs(best-v))best=s}return best}
function sizeLabel(v,tc){const list=tc==='crochet'?HOOKS:NEEDLES;const f=list.find(x=>x[0]===+v);return mm(v)+(f&&f[1]?` (US ${f[1]})`:'')}
const tagList=s=>(s||'').split(',').filter(x=>x.trim()).map(x=>`<span class="tag grey">#${esc(x.trim())}</span>`).join('');

/* =====================================================================
   MOTOR DE SUGERENCIAS
   ===================================================================== */
function suggest(p){
  const ti=tipoInfo(p.tipo);
  const cat=(p.categoria!==''&&p.categoria!=null)?+p.categoria:ti.cats[0];
  const c=CYC[cat];
  const range=p.tecnica==='crochet'?c.hook:c.needle;
  let base=range[1]==null?range[0]:(range[0]+range[1])/2;
  if(p.tecnica==='crochet'&&ti.ajuste)base+=ti.ajuste;
  const list=p.tecnica==='crochet'?HOOKS:NEEDLES;
  const aguja=snap(Math.max(base,list[0][0]),list);
  let k=FACTOR[cat]/FACTOR[ti.cats[0]];
  if(p.tecnica!==ti.base)k*=p.tecnica==='crochet'?1.25:0.8;
  const metros=ti.metros.map(x=>Math.round(x*k/10)*10);
  return {cat,c,aguja,rangeTxt:fmtRange(range),metros,fibra:ti.fibra,nota:ti.nota||'',recCats:ti.cats,tipo:ti};
}
function genMateriales(p){
  const s=suggest(p),M=t('mat');
  const size=sizeLabel(p.aguja||s.aguja,p.tecnica);
  const items=[
    M.yarn.replace('{cat}',s.cat).replace('{name}',catName(s.cat)).replace('{types}',CYC[s.cat].tipos).replace('{m1}',s.metros[0]).replace('{m2}',s.metros[1]),
    (p.tecnica==='crochet'?M.hook:M.needles).replace('{s}',size),
    M.scissors,M.tapestry,M.tape,M.markers,...s.tipo.extra];
  return [...new Set(items)].map(x=>({id:uid(),texto:x,hecho:false,auto:true}));
}

function applyTheme(){
  const st=S.settings,r=document.documentElement.style;
  for(const k of ['bg','surface','text','primary','accent'])r.setProperty('--'+k,st.theme[k]);
  r.setProperty('--radius',st.radius+'px');r.setProperty('--font',FONTS[st.font]||FONTS.sistema);
  $('#brand-name').textContent=appName();$('#brand-logo').textContent=st.logo;document.title=appName();
  $('#side-foot').innerHTML=t('sideFoot');document.documentElement.lang=curLang();
  $('#langsel').innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${curLang()===k?'selected':''}>${v}</option>`).join('');
  $('#langsel').title=t('language');$('#langsel').setAttribute('aria-label',t('language'));
}

function formSuggest(changed){
  const f=$('#pf');if(!f)return;
  const p={tecnica:f.tecnica.value,tipo:f.tipo.value,categoria:changed==='tipo'?null:f.categoria.value};
  const s=suggest(p);
  if(changed==='tipo'){f.categoria.innerHTML=catOptions(s.cat,s.recCats);f.fibra.value=s.fibra}
  if(changed==='tipo'||changed==='cat'||changed==='tec')f.aguja.value=s.aguja;

  $('#sugbox').innerHTML=`<div class="note"><b>${t('suggTitle')}</b> ${t('sugg',{tipo:s.tipo.l.toLowerCase(),tec:tec(p.tecnica).toLowerCase(),cat:s.cat,catName:catName(s.cat),range:s.rangeTxt,size:sizeLabel(s.aguja,p.tecnica),m1:s.metros[0],m2:s.metros[1]})}

}

    patternId:f.patternId.value,tutorialId:f.tutorialId.value,inicio:f.inicio.value,fin:f.fin.value,para:f.para.value,notas:f.notas.value};

}

function parseVideo(url){
  url=(url||'').trim();let m;
  if((m=url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([\w-]{11})/)))return {provider:'youtube',vid:m[1]};
  if((m=url.match(/vimeo\.com\/(?:.*\/)?(?:video\/)?(\d{6,})/)))return {provider:'vimeo',vid:m[1]};
  if(/\.(mp4|webm|ogg|mov)(\?|#|$)/i.test(url))return {provider:'file',vid:url};
  return {provider:'link',vid:''};
}
function thumbOf(tu){return tu.provider==='youtube'?`https://i.ytimg.com/vi/${tu.vid}/mqdefault.jpg`:''}
function watchUrl(tu,sec=0){
  if(tu.provider==='youtube')return `https://www.youtube.com/watch?v=${tu.vid}${sec?`&t=${Math.floor(sec)}s`:''}`;
  if(tu.provider==='vimeo')return `https://vimeo.com/${tu.vid}${sec?`#t=${Math.floor(sec)}s`:''}`;
  return tu.url;
}
function parseChapters(txt){
  const out=[];
  for(const line of (txt||'').split(/\r?\n/)){
    const m=line.match(/(\d{1,2}:)?\d{1,2}:\d{2}/);if(!m)continue;
    const texto=(line.slice(0,m.index)+' '+line.slice(m.index+m[0].length)).replace(/^[\s\-–—:|·.)\]]+|[\s\-–—:|·(\[]+$/g,'').trim();
    out.push({id:uid(),t:parseTime(m[0]),texto:texto||t('defStep'),hecho:false});
  }
  return out.sort((a,b)=>a.t-b.t);
}

  if(tab==='abrevp'){const G=L().glossK;body=`<h2>${t('abbrKTitle')}</h2>
    <div class="tablewrap"><table><tr>${en?'':`<th>${t('thLocal')}</th><th>${t('thAbbr')}</th>`}<th>${t('thEn')}</th></tr>
    ${GLOSS_K_EN.map((r,i)=>`<tr>${en?'':`<td>${G[i][0]}</td><td><b>${G[i][1]}</b></td>`}<td>${r}</td></tr>`).join('')}</table></div><p class="small muted">${t('abbrNote')}</p>`}
  if(tab==='niveles')body=`<h2>${t('levelsTitle')}</h2><p class="muted">${t('levelsSub')}</p>
    <div class="grid g2">${Object.entries(L().levels).map(([k,v])=>`<div class="card"><h3>${'●'.repeat(k)}${'○'.repeat(4-k)} ${v}</h3><p style="margin:0">${L().levelDesc[k]}</p></div>`).join('')}</div>`;
  if(tab==='empezar')body=`<h2>${t('startTitle')}</h2><div class="grid g2">${t('startCards').map(c=>`<div class="card">${c}</div>`).join('')}</div>`;
  return `<h1>${t('guideTitle')}</h1><p class="sub">${t('guideSub')}</p>
  <div class="tabs">${Object.entries(TB).map(([k,l])=>`<button class="${tab===k?'active':''}" onclick="go('guide',null,'${k}')">${l}</button>`).join('')}</div>
  <div class="card">${body}</div>
  <p class="small muted" style="margin-top:14px">${t('guideSrc',{link:'<a href="https://www.yarnstandards.com" target="_blank" rel="noopener">www.YarnStandards.com</a>'})}</p>`;
}

/* =====================================================================
   AJUSTES
   ===================================================================== */
function viewSettings(){
  const st=S.settings,size=new Blob([JSON.stringify(S)]).size,CN=t('colors'),PN=t('presetNames'),FN=t('fontNames');
  return `<h1>${t('setTitle')}</h1><p class="sub">${t('setSub')}</p>
  <div class="grid g2">
    <div class="card"><h2>${t('appearance')}</h2>
      <div class="field"><label>🌐 ${t('language')}</label><select onchange="setLang(this.value)">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${curLang()===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <label>${t('presets')}</label>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:16px">
      ${Object.entries(PRESETS).map(([k,p])=>`<div class="card preset ${st.preset===k?'active':''}" style="padding:10px;background:${p.bg};color:${p.text}" onclick="setPreset('${k}')"><div class="swatch">${['primary','accent','surface','text'].map(c=>`<i style="background:${p[c]}"></i>`).join('')}</div><div class="small" style="margin-top:6px;font-weight:600">${PN[k]}</div></div>`).join('')}
      </div>
      <label>${t('customColors')}</label>
      ${['bg','surface','text','primary','accent'].map(k=>`<div class="color-row"><input type="color" value="${st.theme[k]}" oninput="setColor('${k}',this.value)"><span>${CN[k]}</span></div>`).join('')}
      <div class="fgrid" style="margin-top:12px">
        <div class="field"><label>${t('font')}</label><select onchange="S.settings.font=this.value;applyTheme();save()">${Object.keys(FONTS).map(k=>`<option value="${k}" ${st.font===k?'selected':''}>${FN[k]}</option>`).join('')}</select></div>
        <div class="field"><label>${t('corners')}: <span id="rv">${st.radius}</span> px</label><input type="range" min="0" max="26" value="${st.radius}" style="width:100%;accent-color:var(--primary)" oninput="S.settings.radius=+this.value;$('#rv').textContent=this.value;applyTheme();save()"></div>
      </div>
      <div class="fgrid">
        <div class="field"><label>${t('appName')}</label><input type="text" value="${esc(appName())}" oninput="S.settings.name=this.value;applyTheme();save()"></div>
        <div class="field"><label>${t('icon')}</label><input type="text" maxlength="4" value="${esc(st.logo)}" oninput="S.settings.logo=this.value||'🧶';applyTheme();save()"></div>
      </div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card"><h2>${t('expNotion')}</h2>
        <p class="small">${t('expIntro')}</p>
        <div class="row"><button class="btn" onclick="exportCSV('projects')">${t('csvProj')}</button><button class="btn" onclick="exportCSV('patterns')">${t('csvPat')}</button><button class="btn" onclick="exportCSV('tutorials')">${t('csvTut')}</button></div>
        <div class="row" style="margin-top:8px"><button class="btn" onclick="exportMD()">${t('mdAll')}</button></div>
        <div class="note">${t('notionHow')}</div>
        <p class="small muted" style="margin-bottom:0">${t('notionNoFiles')}</p>
      </div>
      <div class="card"><h2>${t('backupT')}</h2>
        <p class="small">${t('backupTxt',{mb:num((size/1024/1024).toFixed(2))})}</p>
        <div class="row"><button class="btn primary" onclick="backup()">${t('dlBackup')}</button><label class="btn" style="margin:0;color:var(--text);font-size:15px">${t('restore')}<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div>
        <hr style="border:0;border-top:1px solid var(--border);margin:16px 0">
        <div class="row"><button class="btn" onclick="loadDemo()">${t('loadDemo')}</button><button class="btn danger" onclick="wipe()">${t('wipe')}</button></div>
      </div>
    </div>
  </div>`;
}
function setPreset(k){S.settings.preset=k;S.settings.theme={...PRESETS[k]};applyTheme();save();render()}
function setColor(k,v){S.settings.theme[k]=v;S.settings.preset='';applyTheme();save()}
function csvCell(v){v=v==null?'':String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
const plain=s=>String(s).replace(/^\S+\s/,'');
function exportCSV(col){
  let rows;
  if(col==='projects')rows=[t('csvP'),...S.projects.map(p=>{const s=suggest(p);return [p.name,tec(p.tecnica),tipoTxt(p.tipo).l,plain(est(p.estado)),p.progreso||0,p.vueltas||0,`${p.categoria} - ${catName(p.categoria)}`,p.fibra,p.aguja,`${s.metros[0]}-${s.metros[1]}`,
      (p.lanas||[]).map(l=>`${l.marca} ${l.color||''} x${l.ovillos||'?'}`).join(' | '),(p.materiales||[]).map(m=>(m.hecho?'[x] ':'[ ] ')+m.texto).join(' | '),(byId(S.patterns,p.patternId)||{}).titulo||'',(byId(S.tutorials,p.tutorialId)||{}).titulo||'',p.para||'',p.inicio||'',p.fin||'',p.notas||'']})];
  if(col==='patterns')rows=[t('csvPa'),...S.patterns.map(p=>[p.titulo,tec(p.tecnica),lvl(p.nivel),hasCat(p)?`${p.categoria} - ${catName(p.categoria)}`:'',p.autor||'',p.url||'',t('term')[p.term]||'',p.tags||'',p.fav?t('yes'):t('no'),p.texto||''])];
  if(col==='tutorials')rows=[t('csvT'),...S.tutorials.map(tu=>[tu.titulo,tu.url,tu.autor||'',tec(tu.tecnica),lvl(tu.nivel),tu.tags||'',tu.pasos.map(s=>`${fmtTime(s.t)} ${s.texto}`).join(' | '),pct(tu),tu.notas||''])];
  const name=t('files')[col];
  download(`${name}.csv`,'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8');toast(t('downloaded',{f:name+'.csv'}));
}
function projectMd(p){
  const s=suggest(p),c=CYC[p.categoria];
  return `## ${p.name}\n\n- **${t('technique')}:** ${tec(p.tecnica)} · **${t('mdType')}:** ${tipoTxt(p.tipo).l} · **${t('status')}:** ${est(p.estado)}\n- **${t('progress')}:** ${p.progreso||0}% · ${t('row')} ${p.vueltas||0}\n- **${t('yarn')}:** ${t('category')} ${c.cat} (${catName(c.cat)} · ${c.tipos}) — ${p.fibra}\n- **${p.tecnica==='crochet'?t('hook'):t('needles')}:** ${sizeLabel(p.aguja,p.tecnica)}\n- **${t('estYarn')}:** ${s.metros[0]}–${s.metros[1]} m\n${p.para?`- **${t('mdFor')}:** ${p.para}\n`:''}${p.inicio?`- **${t('mdDates')}:** ${p.inicio}${p.fin?' → '+p.fin:''}\n`:''}\n### ${plain(t('materials'))}\n${(p.materiales||[]).map(m=>`- [${m.hecho?'x':' '}] ${m.texto}`).join('\n')}\n${(p.lanas||[]).length?`\n### ${t('mdYarns')}\n${p.lanas.map(l=>`- ${l.marca}${l.comp?' ('+l.comp+')':''} — ${l.color||''}${l.lote?' · '+t('mdLot')+' '+l.lote:''} · ${t('mdSkeins',{n:l.ovillos||'?',m:l.metros||'?'})}`).join('\n')}\n`:''}${p.notas?`\n### ${t('notes')}\n${p.notas}\n`:''}`;
}
function copyProjectMd(id){const md=projectMd(byId(S.projects,id));(navigator.clipboard?navigator.clipboard.writeText(md):Promise.reject()).then(()=>toast(t('copiedNotion'))).catch(()=>{download('project.md',md,'text/markdown');toast(t('dlMd'))})}
function exportMD(){
  const F=t('files');
  let md=`# ${appName()}\n\n_${t('mdExported')} ${today()}_\n\n# ${F.projects}\n\n${S.projects.map(projectMd).join('\n')}\n\n# ${F.patterns}\n\n`;
  md+=S.patterns.map(p=>`## ${p.titulo}\n\n- ${tec(p.tecnica)} · ${lvl(p.nivel)}${p.autor?' · '+p.autor:''}\n${p.url?`- [${t('mdLink')}](${p.url})\n`:''}\n${p.texto?'```\n'+p.texto+'\n```\n':''}`).join('\n');
  md+=`\n# ${F.tutorials}\n\n`+S.tutorials.map(tu=>`## ${tu.titulo}\n\n[${t('mdWatch')}](${tu.url})\n\n${tu.pasos.map(s=>`- [${s.hecho?'x':' '}] [${fmtTime(s.t)}](${watchUrl(tu,s.t)}) ${s.texto}`).join('\n')}\n`).join('\n');
  download(`${appName().replace(/\s+/g,'-')}.md`,md,'text/markdown;charset=utf-8');toast(t('mdDl'));
}
function backup(){download(`yarn-backup-${today()}.json`,JSON.stringify(S),'application/json');toast(t('backupDl'))}
function restore(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.projects||!d.patterns||!d.tutorials)throw 0;
  if(!confirm(t('restoreConfirm')))return;
  const lang=S.settings.lang;S={...blankState(),...d,settings:{...DEFAULT_SETTINGS(),lang,...(d.settings||{})}};save();applyTheme();render();toast(t('restored'))}catch(e){toast(t('badBackup'))}};r.readAsText(file)}
function wipe(){if(!confirm(t('wipe1')))return;if(!confirm(t('wipe2')))return;const st=S.settings;S=blankState();S.settings=st;save();go('dash');toast(t('wiped'))}
function loadDemo(){
  const D=t('demo');
  const pat={id:uid(),created:Date.now(),titulo:D.patTitle,tecnica:'crochet',nivel:1,categoria:3,autor:D.author,url:'',term:curLang()==='en'?'us':curLang(),tags:D.patTags,fav:true,texto:D.patText};
  const tut={id:uid(),created:Date.now(),titulo:D.tutTitle,url:'https://www.youtube.com/results?search_query='+encodeURIComponent(D.tutQuery),provider:'link',vid:'',autor:'',tecnica:'crochet',nivel:1,tags:D.tutTags,notes:'',notas:D.tutNotes,
    pasos:D.steps.map((x,i)=>({id:uid(),t:[0,30,90,150][i],texto:x,hecho:false}))};
  const pr={id:uid(),created:Date.now(),name:D.projName,tecnica:'crochet',tipo:'amigurumi',estado:'curso',categoria:3,progreso:30,vueltas:4,inicio:today(),patternId:pat.id,tutorialId:tut.id,lanas:[],notas:D.projNotes};
  const s=suggest(pr);pr.aguja=s.aguja;pr.fibra=s.fibra;pr.materiales=genMateriales(pr);
  S.patterns.push(pat);S.tutorials.push(tut);S.projects.push(pr);save();go('dash');toast(t('demoAdded'));
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
(async()=>{
  await Store.open();
  const d=await Store.get();
  S=d?{...blankState(),...d,settings:{...DEFAULT_SETTINGS(),...(d.settings||{})}}:blankState();
  if(d&&!d.settings.lang)S.settings.lang='es';
  applyTheme();render();
})();

</script>
</body>
</html>
